[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# env.py reads DATABASE_URL from the application settings. This value is only a
# local placeholder and is not used when settings load.
sqlalchemy.url = postgresql+psycopg://healthify:healthify@localhost:5432/healthify

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
