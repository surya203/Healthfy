# Local PostgreSQL only. The API and Vite dev server run on the host.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: healthify
      POSTGRES_PASSWORD: healthify
      POSTGRES_DB: healthify
      TZ: UTC
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthify -d healthify"]
      interval: 5s
      timeout: 5s
      retries: 10
